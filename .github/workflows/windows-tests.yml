# The full test suite on Windows with JDK 21.
#
# Why: ci.jenkins.io builds Windows on JDK 21 too (Jenkinsfile, "Jenkins" check), but only the
# tests tagged @Tag("core") (pom.xml, profile core-tests-on-jenkins): the whole suite is too
# long for its agents (jenkinsci/batch-control-plugin#80). This workflow runs every test on
# Windows, as build.yml does on Linux. It runs the same test groups as build.yml
# (.github/test-shards.txt, through .github/scripts/test-shards.py) on windows-latest with
# JDK 21, lets every group finish (-Dmaven.test.failure.ignore=true, fail-fast off), and the
# "windows test summary" job lists every failing test, every class with no report and the
# per-group totals in its job summary. The raw reports are in the windows-surefire-<group-id>
# artifacts.
#
# Red on any failure: the summary job fails when a test failed or errored, a class has no
# report, or a test job did not succeed (build error, timeout). It is not a required status
# check, so it may be path-filtered: it runs on pull requests and pushes to main that change
# the code, the build or the test groups, and on demand. Keep its job names away from
# build.yml's ("build", "test (jdk ..., ...)").
#
# How to run it on a branch (on your fork: add -R <you>/batch-control-plugin):
#   gh workflow run windows-tests.yml --ref <branch>
#   gh run watch "$(gh run list --workflow windows-tests.yml --limit 1 --json databaseId --jq '.[0].databaseId')"
---
name: Windows tests
on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'pom.xml'
      - '.mvn/**'
      - '.github/test-shards.txt'
      - '.github/scripts/**'
      - '.github/workflows/windows-tests.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'pom.xml'
      - '.mvn/**'
      - '.github/test-shards.txt'
      - '.github/scripts/**'
      - '.github/workflows/windows-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

# Concurrency, by event (see #88):
# - push: keyed by commit SHA, so every push to main gets its own complete run. A
#   ref-keyed group lost the middle run: with one run in progress and one pending, a
#   third push replaced the pending run.
# - pull_request: keyed by PR number, so a new push to the PR still replaces the
#   unfinished run.
# - workflow_dispatch: keyed by SHA plus the event name, so a manual run can no longer
#   cancel a push run that is in progress.
concurrency:
  group: windows-tests-${{ github.event.pull_request.number || github.sha }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  plan:
    name: windows test plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.shards.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: List the test groups (JDK 21 only)
        id: shards
        env:
          JDKS: '21'
        run: python3 .github/scripts/test-shards.py check

  test:
    name: windows test (jdk ${{ matrix.jdk }}, ${{ matrix.label }})
    needs: plan
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    defaults:
      run:
        # Git Bash. Inside double quotes the '*' of the -Dtest patterns is not globbed, and
        # PowerShell would split the dotted -D property names.
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}
          cache: maven
      # To compare with ci.jenkins.io's agent when a failure looks environmental.
      - name: Show the environment
        run: |
          mvn -B -v
          echo "core.autocrlf=$(git config --get core.autocrlf || echo unset)"
          echo "TEMP=$TEMP"
          echo "NUMBER_OF_PROCESSORS=$NUMBER_OF_PROCESSORS"
      # Same command as build.yml's test job, plus failure.ignore so that a failing test
      # does not stop the group: the summary job decides. The step timeout is shorter than
      # the job's so that the reports of a slow group are still uploaded.
      # A single group can fail before any test when Maven cannot resolve an artifact it
      # only needs at run time (the git-changelist extension, a Surefire provider: #88);
      # re-runs pass for these failures, so retry the Maven invocation once when it fails
      # with a resolution error — and only then. A real test failure still ends the step
      # at once, because failure.ignore makes Maven exit 0 when tests fail.
      - name: Test
        timeout-minutes: 75
        env:
          GROUP_TESTS: ${{ matrix.tests }}
        run: |
          status=0
          mvn -B -ntp clean test -Dtest="$GROUP_TESTS" -Daccess-modifier-checker.skip=true -Dmaven.test.failure.ignore=true 2>&1 | tee maven.log || status=$?
          if [ "$status" -ne 0 ] && grep -qE "could not be resolved|Could not find artifact|Could not resolve" maven.log; then
            echo "Maven failed on artifact resolution; retrying once (see #88)"
            status=0
            mvn -B -ntp clean test -Dtest="$GROUP_TESTS" -Daccess-modifier-checker.skip=true -Dmaven.test.failure.ignore=true 2>&1 | tee maven.log || status=$?
          fi
          exit "$status"
      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-surefire-${{ matrix.group }}
          path: target/surefire-reports/
          if-no-files-found: warn
          retention-days: 14

  summary:
    name: windows test summary
    needs: [plan, test]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Without merge-multiple: one directory per group, reports/windows-surefire-<group-id>/.
      - name: Download the surefire reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: windows-surefire-*
          path: reports/
      # Red when a test failed or errored, a class has no report or a test job did not
      # succeed (build error, timeout). Not a required check, but a red run needs a look
      # before merging.
      - name: Summarize the failures
        env:
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          status=0
          python3 .github/scripts/surefire-summary.py reports/ || status=1
          if [ "$TEST_RESULT" != "success" ]; then
            echo "::error::at least one Windows test job did not succeed ($TEST_RESULT): see its log"
            status=1
          fi
          exit "$status"
