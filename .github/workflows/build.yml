# Pre-hosting regression gate (docs/CI-PROPOSAL.md N1).
# Runs with the default read-only token and no secrets, so fork pull requests work too.
#
# The Surefire run is split into parallel jobs, one per feature group of test classes.
# The groups, their labels and their patterns live in .github/test-shards.txt;
# .github/scripts/test-shards.py fails the run when a test class matches no group or two
# groups. The static checks run once, in the "checks" job. The final "build" job
# aggregates every job. It is one of the two required status checks on main, with
# ci.jenkins.io's "Jenkins" (CONTRIBUTING.md §7): keep its name, and give this workflow no
# path filter, since a skipped workflow leaves a required check pending.
#
# Every JDK the jenkinsci hosting checker accepts (21 and 25, R4-3) gets its own static
# checks job ("build (jdk 21)") and its own test jobs, named by group label ("test (jdk 25,
# run approval and mail)"). The list lives in env.JDKS (plan job, test matrix) and in the
# checks matrix below; keep the two in sync with each other. They need not match the
# Jenkinsfile: ci.jenkins.io builds Linux on JDK 25 and Windows on JDK 21 with the @Tag("core")
# tests only (pom.xml, core-tests-on-jenkins), so these jobs are where the whole suite runs on
# Linux; windows-tests.yml runs it on Windows.
---
name: Build
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Concurrency, by event (see #88): push runs are keyed by commit SHA, so every push to
# main gets its own complete run instead of replacing a pending one (the same ref-keyed
# flaw as windows-tests.yml); pull-request runs stay keyed by PR number, so a new push to
# the PR still replaces the unfinished run; manual runs are keyed by ref, so a new manual
# run on the same branch replaces the unfinished one while still sharing no group with
# push runs. cancel-in-progress is off for push runs only, so a manual run replaces a
# manual run but never a push run.
concurrency:
  group: build-${{ github.event.pull_request.number || (github.event_name == 'workflow_dispatch' && github.ref) || github.sha }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

# Every run step uses "shell: bash", which GitHub runs as "bash --noprofile --norc -eo
# pipefail {0}" (#172). A step with no shell runs as "bash -e {0}", without pipefail: the
# Maven steps pipe into tee, so the pipeline's status was tee's 0, the step passed whatever
# Maven did and the #88 retry never ran. Set for the whole workflow, so a new step cannot
# leave it out.
defaults:
  run:
    shell: bash

# The Maven steps retry once when Maven failed on artifact resolution (#88), and only then:
# a line of Maven's own [ERROR]/[FATAL] output naming a resolution failure, which includes a
# 429 Too Many Requests from Maven Central (#177). One copy for both Maven steps.
env:
  RESOLUTION_ERROR: '^\[(ERROR|FATAL)\] .*(could not be resolved|Could not (find|transfer) artifact|Could not resolve|Failed to (read artifact descriptor|collect dependencies)|status code: 429|Too Many Requests)'

jobs:
  plan:
    name: shard safeguard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.shards.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check that every test class is in exactly one group
        id: shards
        env:
          JDKS: '21,25'
        run: python3 .github/scripts/test-shards.py check

  checks:
    name: build (jdk ${{ matrix.jdk }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        jdk: ['21', '25']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The Maven cache (#177). A cache key is saved once and never changes, so the first
      # job to save it decides what every later job finds in it. These two jobs save it;
      # the test jobs and e2e.yml's build only restore it (cache-read-only), because they
      # resolve less than these jobs do (SpotBugs and the other verify-phase plugins; the
      # e2e build not even Surefire's runtime).
      # The key hashes the files that decide what Maven resolves, and the Maven line (3.9,
      # 3.10, ...) of the runner image, which this step reads with the image's own Java
      # before setup-java computes the key. Maven 3.10 records where an artifact came from
      # under URL-qualified keys that Maven 3.9 does not match, so on a cache Maven 3.10
      # saved, Maven 3.9 checks every artifact against the remote repositories again, in
      # every job: ubuntu-latest moved from Maven 3.10 to 3.9 with Ubuntu 26.04.
      # e2e.yml and windows-tests.yml compute the key the same way; keep the three equal.
      - name: Record the Maven line for the cache key
        run: |
          mkdir -p target
          mvn -B -v | sed -n 's/^Apache Maven \([0-9]*\.[0-9]*\).*/\1/p' > target/maven-line.txt
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}
          cache: maven
          cache-dependency-path: |
            pom.xml
            .mvn/extensions.xml
            .mvn/maven.config
            target/maven-line.txt
      # Enforcer, access-modifier checker, SpotBugs and the other verify-phase checks,
      # plus compilation of the test sources. Tests run in the test jobs.
      # Surefire runs too, in-process (forkCount=0) and only for tests with a tag that no
      # test has, so no test runs. It runs so that the cache this job saves holds what
      # Surefire resolves only when it runs tests, the JUnit Platform provider and
      # launcher; -DskipTests leaves them out and every test job fetched them from Maven
      # Central (#177).
      # Retry once on a transient artifact-resolution failure, as in the test jobs (#88):
      # only a resolution error (RESOLUTION_ERROR above) retries, so a real check failure
      # still fails at once. The retry waits 60 to 120 s first, since a 429 asks the
      # client to slow down, and removes target/, since Maven activates the parent POM's
      # java-level-21 profile from target/java-level/21 before "clean" runs: in the same
      # workspace a second run checks bytecode levels and resolves jars the first run
      # never needed (#177). The two-attempt loop keeps a single copy of the command, so
      # the retry cannot drift from the first attempt. With pipefail (the defaults above,
      # #172), status is Maven's exit status, not tee's.
      - name: Build and check (no test runs)
        run: |
          attempt=0
          status=0
          while [ "$attempt" -lt 2 ]; do
            attempt=$((attempt + 1))
            status=0
            mvn -B -ntp clean verify -DforkCount=0 -Dgroups=no-test-has-this-tag 2>&1 | tee maven.log || status=$?
            if [ "$status" -eq 0 ]; then
              break
            fi
            if ! grep -qE "$RESOLUTION_ERROR" maven.log; then
              break
            fi
            [ "$attempt" -lt 2 ] || break
            pause=$((60 + RANDOM % 61))
            echo "Maven failed on artifact resolution; retrying once in $pause s (see #88, #177)"
            sleep "$pause"
            rm -rf target
          done
          exit "$status"

  test:
    name: test (jdk ${{ matrix.jdk }}, ${{ matrix.label }})
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The same cache key as the checks jobs (see there, #177).
      - name: Record the Maven line for the cache key
        run: |
          mkdir -p target
          mvn -B -v | sed -n 's/^Apache Maven \([0-9]*\.[0-9]*\).*/\1/p' > target/maven-line.txt
      # Restore only: the checks jobs save the cache, with the Surefire runtime in it.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}
          cache: maven
          cache-dependency-path: |
            pom.xml
            .mvn/extensions.xml
            .mvn/maven.config
            target/maven-line.txt
          cache-read-only: true
      # The access-modifier checker runs once, in the checks job; SpotBugs is bound to
      # verify, which this job does not reach. The enforcer rules take seconds and the
      # parent POM does not honour -Denforcer.skip, so they run here too.
      # Retry once on a transient artifact-resolution failure (#88): only a resolution
      # error (RESOLUTION_ERROR above) retries, so a real test failure still fails the
      # step at once. The retry waits 60 to 120 s and starts from an empty target/, as in
      # the checks job (#177). The two-attempt loop keeps a single copy of the command, so
      # the retry cannot drift from the first attempt. With pipefail (the defaults above,
      # #172), status is Maven's exit status, not tee's.
      - name: Test
        env:
          GROUP_TESTS: ${{ matrix.tests }}
        run: |
          attempt=0
          status=0
          while [ "$attempt" -lt 2 ]; do
            attempt=$((attempt + 1))
            status=0
            mvn -B -ntp clean test -Dtest="$GROUP_TESTS" -Daccess-modifier-checker.skip=true 2>&1 | tee maven.log || status=$?
            if [ "$status" -eq 0 ]; then
              break
            fi
            if ! grep -qE "$RESOLUTION_ERROR" maven.log; then
              break
            fi
            [ "$attempt" -lt 2 ] || break
            pause=$((60 + RANDOM % 61))
            echo "Maven failed on artifact resolution; retrying once in $pause s (see #88, #177)"
            sleep "$pause"
            rm -rf target
          done
          exit "$status"
      # A second guard behind the Test step's exit status (#172): fails when a class of
      # the group has no report, a class of another group ran, or a report counts a
      # failure or an error.
      - name: Check that the group ran exactly its classes and they passed
        env:
          GROUP_ID: ${{ matrix.group }}
        run: python3 .github/scripts/test-shards.py verify "$GROUP_ID"
      - name: Upload surefire reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: surefire-reports-jdk${{ matrix.jdk }}-${{ matrix.group }}
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 14

  build:
    name: build
    needs: [plan, checks, test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to succeed
        env:
          PLAN: ${{ needs.plan.result }}
          CHECKS: ${{ needs.checks.result }}
          TEST: ${{ needs.test.result }}
        run: |
          echo "plan=$PLAN checks=$CHECKS test=$TEST"
          for r in "$PLAN" "$CHECKS" "$TEST"; do
            if [ "$r" != "success" ]; then
              echo "::error::a required job did not succeed (plan=$PLAN checks=$CHECKS test=$TEST)"
              exit 1
            fi
          done
