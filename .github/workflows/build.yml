# Pre-hosting regression gate (docs/CI-PROPOSAL.md N1).
# Runs with the default read-only token and no secrets, so fork pull requests work too.
#
# The Surefire run is split into parallel jobs, one per feature group of test classes.
# The groups, their labels and their patterns live in .github/test-shards.txt;
# .github/scripts/test-shards.py fails the run when a test class matches no group or two
# groups. The static checks run once, in the "checks" job. The final "build" job
# aggregates every job. It is one of the two required status checks on main, with
# ci.jenkins.io's "Jenkins" (CONTRIBUTING.md §7): keep its name, and give this workflow no
# path filter, since a skipped workflow leaves a required check pending.
#
# Every JDK the jenkinsci hosting checker accepts (21 and 25, R4-3) gets its own static
# checks job ("build (jdk 21)") and its own test jobs, named by group label ("test (jdk 25,
# run approval and mail)"). The list lives in env.JDKS (plan job, test matrix) and in the
# checks matrix below; keep the two in sync with each other. They need not match the
# Jenkinsfile: ci.jenkins.io builds Linux on JDK 25 and Windows on JDK 21 with the @Tag("core")
# tests only (pom.xml, core-tests-on-jenkins), so these jobs are where the whole suite runs on
# Linux; windows-tests.yml runs it on Windows.
---
name: Build
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Concurrency, by event (see #88): push runs are keyed by commit SHA, so every push to
# main gets its own complete run instead of replacing a pending one (the same ref-keyed
# flaw as windows-tests.yml); pull-request runs stay keyed by PR number, so a new push to
# the PR still replaces the unfinished run; manual runs are keyed by SHA plus the event
# name, so they no longer share a group with push runs.
concurrency:
  group: build-${{ github.event.pull_request.number || github.sha }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: shard safeguard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.shards.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check that every test class is in exactly one group
        id: shards
        env:
          JDKS: '21,25'
        run: python3 .github/scripts/test-shards.py check

  checks:
    name: build (jdk ${{ matrix.jdk }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        jdk: ['21', '25']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}
          cache: maven
      # Enforcer, access-modifier checker, SpotBugs and the other verify-phase checks,
      # plus compilation of the test sources. Tests run in the test jobs.
      # Retry once on a transient artifact-resolution failure, as in the test jobs (#88):
      # only a resolution error retries, so a real check failure still fails at once.
      - name: Build and check (tests skipped)
        run: |
          status=0
          mvn -B -ntp clean verify -DskipTests 2>&1 | tee maven.log || status=$?
          if [ "$status" -ne 0 ] && grep -qE "could not be resolved|Could not find artifact|Could not resolve" maven.log; then
            echo "Maven failed on artifact resolution; retrying once (see #88)"
            status=0
            mvn -B -ntp clean verify -DskipTests 2>&1 | tee maven.log || status=$?
          fi
          exit "$status"

  test:
    name: test (jdk ${{ matrix.jdk }}, ${{ matrix.label }})
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}
          cache: maven
      # The access-modifier checker runs once, in the checks job; SpotBugs is bound to
      # verify, which this job does not reach. The enforcer rules take seconds and the
      # parent POM does not honour -Denforcer.skip, so they run here too.
      # Retry once on a transient artifact-resolution failure (#88): only a resolution
      # error retries, so a real test failure still fails the step at once.
      - name: Test
        env:
          GROUP_TESTS: ${{ matrix.tests }}
        run: |
          status=0
          mvn -B -ntp clean test -Dtest="$GROUP_TESTS" -Daccess-modifier-checker.skip=true 2>&1 | tee maven.log || status=$?
          if [ "$status" -ne 0 ] && grep -qE "could not be resolved|Could not find artifact|Could not resolve" maven.log; then
            echo "Maven failed on artifact resolution; retrying once (see #88)"
            status=0
            mvn -B -ntp clean test -Dtest="$GROUP_TESTS" -Daccess-modifier-checker.skip=true 2>&1 | tee maven.log || status=$?
          fi
          exit "$status"
      - name: Check that the group ran exactly its classes
        env:
          GROUP_ID: ${{ matrix.group }}
        run: python3 .github/scripts/test-shards.py verify "$GROUP_ID"
      - name: Upload surefire reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: surefire-reports-jdk${{ matrix.jdk }}-${{ matrix.group }}
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 14

  build:
    name: build
    needs: [plan, checks, test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to succeed
        env:
          PLAN: ${{ needs.plan.result }}
          CHECKS: ${{ needs.checks.result }}
          TEST: ${{ needs.test.result }}
        run: |
          echo "plan=$PLAN checks=$CHECKS test=$TEST"
          for r in "$PLAN" "$CHECKS" "$TEST"; do
            if [ "$r" != "success" ]; then
              echo "::error::a required job did not succeed (plan=$PLAN checks=$CHECKS test=$TEST)"
              exit 1
            fi
          done
