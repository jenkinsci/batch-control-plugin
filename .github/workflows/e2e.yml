# Scripted e2e pass on a real Jenkins, in one shard per group of e2e/ci/shard.py, with JaCoCo
# coverage of the changed lines.
# Contract: e2e/README.md, "CI contract (for .github/workflows)".
#
# The shards are the fixed, named groups of e2e/ci/shard.py (GROUPS). The "e2e groups" job checks
# them (every unit in exactly one group, at most one `last` unit per group, valid labels) and turns
# them into the matrix; each shard job is named after its group's label, "e2e (<label>)". The
# artifacts and e2e/ci/out/<k>/ keep the shard index.
#
# Required check: "e2e result" is the one job of this workflow meant to be a required status
# check on main (next to "build" from build.yml and ci.jenkins.io's "Jenkins"). The other job
# names ("changes", "e2e build", "e2e groups", "e2e (<label>)", "e2e coverage") are kept distinct
# from every required check, because a required check is matched by name; scripts also depend on
# the "e2e ..." names, so they do not change.
#
# The workflow runs on every pull_request and every push to main (no workflow-level "paths"
# filter: a skipped workflow would leave a required check pending forever). The first job,
# "changes", decides whether an input of the suite changed: src/main/**, pom.xml, .mvn/**, e2e/**
# or this file. Pull request: git diff of the PR's base commit against its head commit, three-dot
# (from the merge base, as in the PR's "Files changed"). Push to main: the previous tip against the
# pushed commit. workflow_dispatch, a new branch (all-zero "before"), or a diff that cannot be
# computed: the suite runs. "e2e build", "e2e groups", the shards and "e2e coverage" run only when
# "changes" says so, and then exactly as before.
#
# "e2e result" always runs last. It succeeds when the suite was not needed, or when "e2e build",
# "e2e groups", every "e2e (<label>)" shard and "e2e coverage" all succeeded; any failure,
# cancellation, or a job skipped while the suite was needed makes it fail. Its log gives the reason
# in one line.
#
# Runs with the default read-only token and no secrets, so fork pull requests work too: the
# coverage report goes to the job summary, annotations and an artifact, never to a PR comment
# or a third-party service.
---
name: E2E
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Lightweight gate: does this event touch an input of the suite? Output run=true|false.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.diff.outputs.run }}
    steps:
      # The full history, so that the merge base (pull_request) and the previous tip (push) are present.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Did an input of the suite change?
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        shell: bash
        run: |
          # The same set the workflow-level "paths" filter used to have.
          pattern='^(src/main/|\.mvn/|e2e/)|^(pom\.xml|\.github/workflows/e2e\.yml)$'
          run=true
          range=""
          if [ "$EVENT" = pull_request ]; then
            range="$PR_BASE...$PR_HEAD"
          elif [ "$EVENT" = push ] && [ -n "$BEFORE" ] && ! [[ "$BEFORE" =~ ^0+$ ]]; then
            range="$BEFORE..$AFTER"
          fi
          if [ -z "$range" ]; then
            echo "Event $EVENT without a comparable base: the suite runs."
          elif ! files="$(git diff --name-only "$range")"; then
            echo "::warning::git diff $range failed: the suite runs."
          elif matched="$(grep -E "$pattern" <<<"$files")"; then
            echo "Inputs of the suite changed in $range:"
            echo "$matched"
          else
            run=false
            echo "No input of the suite changed in $range: the suite is skipped."
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  build:
    name: e2e build
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build the plugin (tests skipped)
        run: mvn -ntp -B clean package -DskipTests
      # One build for every job: the classes the coverage job reads must be the ones in the hpi.
      - name: Upload the hpi and its classes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-build
          path: |
            target/batch-control.hpi
            target/classes/
          if-no-files-found: error
          retention-days: 7

  # Needs only changes: runs alongside build. shard.py uses the standard library only, so the runner's python3 is enough.
  # check fails the run on an inconsistent GROUPS (::error:: lines) and writes the group table to the job summary.
  groups:
    name: e2e groups
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.groups.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the groups and build the matrix
        id: groups
        run: |
          python3 e2e/ci/shard.py check
          matrix="$(python3 e2e/ci/shard.py matrix)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  e2e:
    name: e2e (${{ matrix.label }})
    needs: [build, groups]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.groups.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-build
          path: target/
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: e2e/ci/requirements.txt
      - name: Install the Python packages and Chromium
        run: |
          pip install -r e2e/ci/requirements.txt
          python -m playwright install --with-deps chromium
      # Layout checks (round3 "no h-scroll at 1280") must measure text as they do locally: Chromium resolves Jenkins'
      # system-ui font through fontconfig, which is DejaVu Sans (wider) on the runner. e2e/ci/fonts.conf selects
      # Liberation Sans (Arial metrics) for system-ui and sans-serif; fonts-liberation comes with Playwright's
      # Chromium dependencies and is installed again here so the step does not depend on that list.
      - name: Fix the browser fonts
        run: |
          sudo apt-get install -y --no-install-recommends fonts-liberation fontconfig
          mkdir -p ~/.config/fontconfig
          cp e2e/ci/fonts.conf ~/.config/fontconfig/fonts.conf
          fc-cache -f >/dev/null
          echo "system-ui -> $(fc-match system-ui)"
          echo "sans-serif -> $(fc-match sans-serif)"
      # pytest, one test per step (JUnit XML in e2e/ci/out/<k>/junit.xml, Playwright traces of failed steps in
      # e2e/ci/out/<k>/traces/). Exit 1: a step failed; exit 2: the stack did not start (e2e/ci/run.sh).
      - name: Run shard ${{ matrix.shard }} of ${{ matrix.of }} (${{ matrix.label }})
        env:
          BC_BUILD: never
          PY: python
          SHARD: ${{ matrix.shard }}
          OF: ${{ matrix.of }}
        run: e2e/ci/run.sh "$SHARD/$OF"
      - name: Shard summary
        if: always()
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          out="e2e/ci/out/$SHARD"
          if [ -f "$out/junit.xml" ]; then
            python e2e/ci/junit_summary.py "$out/junit.xml" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f "$out/summary.md" ]; then
            cat "$out/summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No summary for shard $SHARD (the stack may not have started; see the shard artifact)." >> "$GITHUB_STEP_SUMMARY"
          fi
      # Execution data, summaries, JUnit XML, step logs, Playwright traces of failed steps, jenkins.log and screenshots.
      - name: Upload the shard output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-shard-${{ matrix.shard }}
          path: e2e/ci/out/${{ matrix.shard }}/
          if-no-files-found: warn
          retention-days: 14

  coverage:
    name: e2e coverage
    needs: [build, e2e]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # The full history, so that the merge base with the base commit is present.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Java only runs the JaCoCo CLI here.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: e2e/ci/requirements.txt
      - name: Download the build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-build
          path: target/
      # Without merge-multiple: one directory per shard, e2e/ci/out/e2e-shard-<k>/jacoco-<k>.exec.
      - name: Download the shard outputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: e2e-shard-*
          path: e2e/ci/out/
      - name: Install the Python packages
        id: pip
        run: pip install -r e2e/ci/requirements.txt
      - name: Fetch the JaCoCo CLI
        run: e2e/ci/fetch-jacoco.sh
      # Pull request: its base commit. Push to main: the previous tip (all zeros for a new
      # branch, then there is nothing to compare with). workflow_dispatch: no base.
      - name: Choose the base commit
        id: base
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          base=""
          if [ "$EVENT" = pull_request ]; then
            base="$PR_BASE"
          elif [ "$EVENT" = push ] && [ -n "$BEFORE" ] && ! [[ "$BEFORE" =~ ^0+$ ]]; then
            base="$BEFORE"
          fi
          echo "base=${base:-none}"
          echo "sha=$base" >> "$GITHUB_OUTPUT"
      # Exit 0 whatever the coverage (no --fail-under until the owner sets a threshold);
      # 3 = execution data and classes do not match, 2 = tool error.
      - name: Coverage of the changed lines
        if: steps.base.outputs.sha != ''
        env:
          BASE: ${{ steps.base.outputs.sha }}
        run: python e2e/ci/coverage-diff.py --exec 'e2e/ci/out/*/jacoco-*.exec' --base "$BASE" --annotations on
      - name: Upload the coverage report
        if: always() && steps.base.outputs.sha != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-coverage
          path: e2e/ci/out/coverage/
          if-no-files-found: warn
          retention-days: 14
      # Self-test of the crawl's content checks (e2e/README.md, "Content checks in the crawl"):
      # the real CONTENT_JS and content_checks() of e2e/r14/crawl.py on two synthetic pages in
      # headless Chromium, no Jenkins, about 10 s, as pytest-playwright tests
      # (e2e/ci/test_selftest_content.py). Last, so that a failure here does not cost the
      # coverage report; and it runs whatever the JaCoCo and coverage steps did (also when there
      # is no base commit), needing only the Python packages. A failure = a page did not give
      # exactly the expected findings; its PASS/FAIL lines go to the job summary.
      - name: Self-test of the content checks
        if: ${{ !cancelled() && steps.pip.outcome == 'success' }}
        shell: bash
        run: |
          python -m playwright install --with-deps chromium
          {
            echo '### Self-test of the content checks'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          rc=0
          python -m pytest e2e/ci/test_selftest_content.py --browser chromium -s -q \
            --tracing retain-on-failure --output e2e/ci/out/selftest 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || rc=$?
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

  # The required status check. Always runs (also on a cancelled run, then it fails), so a PR
  # always gets a verdict, whatever paths it touches.
  result:
    name: e2e result
    needs: [changes, build, groups, e2e, coverage]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verdict
        env:
          CHANGES: ${{ needs.changes.result }}
          RUN: ${{ needs.changes.outputs.run }}
          BUILD: ${{ needs.build.result }}
          GROUPS: ${{ needs.groups.result }}
          E2E: ${{ needs.e2e.result }}
          COVERAGE: ${{ needs.coverage.result }}
        shell: bash
        run: |
          if [ "$CHANGES" != success ]; then
            echo "::error::FAIL: the changes job ended '$CHANGES', so it is unknown whether the suite was needed."
            exit 1
          fi
          if [ "$RUN" != true ]; then
            echo "PASS: no input of the suite changed, the suite was not needed."
            exit 0
          fi
          if [ "$BUILD" = success ] && [ "$GROUPS" = success ] && [ "$E2E" = success ] && [ "$COVERAGE" = success ]; then
            echo "PASS: e2e build, e2e groups, every e2e shard and e2e coverage succeeded."
            exit 0
          fi
          echo "::error::FAIL: the suite was needed; e2e build=$BUILD, e2e groups=$GROUPS, e2e shards=$E2E, e2e coverage=$COVERAGE."
          exit 1
